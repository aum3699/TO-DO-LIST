<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO Do LIst App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h2>TO DO LIST <img src="images/images/icon.png" alt="icon"></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Add a new task">
                <button id="add-btn" type="button">Add</button>
            </div>
            <ul id="list-container">
                <li data-sample="true">Task 1</li>
                <li data-sample="true">Task 2</li>
                <li data-sample="true">Task 3</li>
            </ul>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'todoTasks';
        const inputBox = document.getElementById('input-box');
        const addBtn = document.getElementById('add-btn');
        const listContainer = document.getElementById('list-container');

        function getSavedTasks() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : [];
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function createTodoItem(taskText, index) {
            const li = document.createElement('li');
            const textSpan = document.createElement('span');
            const removeBtn = document.createElement('button');

            textSpan.textContent = taskText;
            removeBtn.textContent = 'Remove';
            removeBtn.className = 'remove-btn';
            removeBtn.type = 'button';
            removeBtn.addEventListener('click', () => removeTodo(index));

            li.appendChild(textSpan);
            li.appendChild(removeBtn);
            return li;
        }

        function renderTasks() {
            const tasks = getSavedTasks();
            listContainer.innerHTML = '';

            if (tasks.length === 0) {
                ['Task 1', 'Task 2', 'Task 3'].forEach((sampleText) => {
                    const placeholder = document.createElement('li');
                    placeholder.textContent = sampleText;
                    placeholder.className = 'placeholder';
                    listContainer.appendChild(placeholder);
                });
                return;
            }

            tasks.forEach((taskText, index) => {
                listContainer.appendChild(createTodoItem(taskText, index));
            });
        }

        function addTodo() {
            const taskText = inputBox.value.trim();
            if (!taskText) return;

            const tasks = getSavedTasks();
            tasks.push(taskText);
            saveTasks(tasks);
            renderTasks();
            inputBox.value = '';
            inputBox.focus();
        }

        function removeTodo(index) {
            const tasks = getSavedTasks();
            tasks.splice(index, 1);
            saveTasks(tasks);
            renderTasks();
        }

        addBtn.addEventListener('click', addTodo);
        inputBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                addTodo();
            }
        });

        renderTasks();
    </script>
</body>
</html>
